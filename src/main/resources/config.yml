# SharedChain Configuration

run:
  # Additional worlds where the challenge is enabled.
  enabled-worlds:
    - world_nether
    - world_the_end
  # Whether players join the challenge automatically when they join an enabled world.
  auto-join: true
  # Whether the run state persists across server restarts.
  persist-state: false

shared-health:
  # Maximum health for all players.
  max-health: 20.0
  # Precision for shared health updates.
  precision: 0.001
  # Whether totems save the entire team once.
  totem-save-all: true
  # Whether potions of instant health/damage affect the shared pool.
  instant-potions-shared: true

timer:
  # Timer display mode: ACTION_BAR (Current recommendation)
  display-mode: ACTION_BAR
  # Whether the run timer pauses while no participants are online.
  pause-when-empty: true

display:
  # Whether to use Adventure for tab header/footer.
  tab-enabled: true
  # Whether to use Scoreboard for team visuals (Required for Sponsor Icon).
  scoreboard-enabled: true
  # Logo image (a font-images name, e.g. title) shown centered at the top of
  # the tab list. Leave empty to show only the tab-header text.
  tab-logo: title
  # Blank lines above the logo: the client anchors the header to the top of the
  # screen and tall images draw upward, so they clip. -1 (default) computes the
  # padding automatically from the logo's height; set a number to override
  # (each pad line holds a single invisible space).
  tab-logo-padding: -1
  # Optional subtitle shown under the logo. Leave empty to show just the logo.
  tab-header: ""

death-tracking:
  # Whether to track and show death counts under each player's name.
  show-death-counts: true
  # Font image used as the icon next to the counter (death-icon.png -> "death-icon").
  # Drop the PNG into plugins/SharedChain/font-images/ and run /sharedchain fonts reload.
  death-icon: deaths
  # Whether to show a dramatic sound effect on wipe.
  dramatic-wipe: true
  # The sound to play on wipe.
  wipe-sound: "entity.illusioner.prepare_blindness"
  # Pitch for the wipe sound (1.0 plays the file at original speed)
  wipe-sound-pitch: 1.0

world-reset:
  # Reset mode: NONE, INTERNAL, FAHARE_COMPAT
  mode: INTERNAL
  # External Fahare reset command used when mode is set to FAHARE_COMPAT
  fahare-reset-command: "fahare reset"
  # Whether to automatically reset when all players die (wipe).
  auto-reset-on-wipe: true
  # Whether to backup the world before reset (INTERNAL mode).
  backup-before-reset: false
  # The name of the challenge world.
  challenge-world-name: "ayin_run"
  # The holding world name for players during reset.
  holding-world-name: "ayin_limbo"
  # Whether to save the world data when unloading.
  save-on-unload: false

lobby:
  # Small lobby border size.
  lobby-border-size: 10.0
  # Playable border size after start.
  active-border-size: 100000.0
  # Countdown before the run starts (in seconds).
  countdown-seconds: 5

chain:
  # Whether the team chain constraint is enabled.
  enabled: true
  # Visual scale of chain anchor entities (smaller = less interaction blocking).
  anchor-scale: 0.1
  # Offsets for the anchor point on the player.
  anchor-back-offset: 0.38
  anchor-side-offset: 0.0
  anchor-y-offset: 0.7
  # Maximum allowed distance between linked adjacent players.
  max-distance: 8.0
  # Extra tolerance before pull starts.
  slack-distance: 0.75
  # Pull strength per tick when players stretch the chain.
  pull-strength: 0.08
  # Cap on added pull velocity per tick.
  max-pull-per-tick: 0.18
  # Interval (in ticks) to refresh entity leash attachments.
  leash-refresh-interval: 100
  # Maximum resulting player velocity vector magnitude after chain pull physics.
  max-result-velocity: 1.6
  # Ticks of movement prediction applied when positioning waist anchor entities.
  anchor-prediction-ticks: 0.35

messages:
  prefix: "<dark_gray>[<gold>SharedChain</gold>]</dark_gray> "
  run-started: "<green>The challenge has started! Good luck!</green>"
  run-stopped: "<red>The challenge has been stopped.</red>"
  run-finished: "<gold><b>Congratulations!</b> The challenge has been completed in <white><timer></white>!</gold>"
  run-wiped: "<red><b>WIPE!</b> <player> died due to <cause>. Total deaths: <deaths>.</red>"
  no-permission: "<red>You don't have permission to do that.</red>"

font-images:
  # Render images in chat and plugin messages with %imagename% placeholders.
  # Drop PNGs (any dimensions up to 256x256; rendered 1:1 at native size) into:
  #   plugins/SharedChain/font-images/
  # Optional per-image overrides go in plugins/SharedChain/font-images.yml:
  #   mylogo:
  #     ascent: 10        # distance from the text baseline up to the image top
  #     width: 128        # resize before slicing (multiples of 8, max 256)
  #     height: 48        # omit one to keep the aspect ratio
  #     render-height: 64 # render a high-res source at a smaller on-screen size;
  #                       # the client downsamples it so it stays smooth (great for
  #                       # keeping a big logo image compact in the tab list)
  enabled: true
  # Bundled attempt counter: the boss bar already shows the run number using
  # custom glyphs (digits + "ATTEMPT" label + pill background). These used to
  # come from a separate custom resource pack; they are now generated into this
  # pack so everyone sees them.
  attempt-counter:
    enabled: true
    # Hides the yellow boss bar fill, leaving only the attempt-counter text.
    hide-bar: true
  # First private-use-area character used for the glyphs. Glyphs are merged into
  # the default font (vanilla providers preserved) because chat always renders with
  # the default font. If other resource packs also redefine the default font, this
  # server pack takes precedence.
  base-char: "\uF000"
  # Default glyph ascent (distance from the baseline up to the image top). Defaults
  # to the image height when unset. Can be overridden per image in font-images.yml.
  # ascent: 8
  pack-server:
    # Built-in HTTP server that serves the generated resource pack to clients.
    enabled: true
    port: 8123
    # Override the URL clients use to download the pack. Defaults to
    # http://localhost:<port>/pack.zip - change this if clients connect over LAN.
    url: ""

tags:
  # Role tags shown next to a player's name in the tab list and above their head
  # (via the scoreboard team prefix). Drop a PNG into
  # plugins/SharedChain/font-images/ (e.g. dev.png) and reference it by name here.
  # Draw badges at native pixel size - any dimensions up to 256x256 work, and the
  # client renders them 1:1. Leave an image empty to disable that tag.
  dev:
    # Shown on this player only (accepts a name or a UUID).
    image: dev
    player: ""
  # Shown on whoever is currently the healing sponsor during a run. Replaces
  # the old green text heart when set.
  sponsor:
    image: ""
  # Shown on the current record holder (fastest run time). Toggle per player
  # with /sharedchain wr <player> (run it again to remove). Image names are
  # lowercase, so WR.png is referenced as "wr". The future leaderboard will
  # set this automatically.
  record-holder:
    image: ""

debug:
  # Whether to enable debug logging in console.
  logging: false
