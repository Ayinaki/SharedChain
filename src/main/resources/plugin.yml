name: SharedChain
version: '${version}'
main: me.ayinaki.sharedchain.SharedChain
api-version: '26.2'
prefix: SharedChain
author: Ayinaki
description: A team challenge plugin with shared health and chained players.
folia-supported: false

commands:
  sharedchain:
    description: Main command for SharedChain.
    aliases: [sc, chain]
    permission: sharedchain.use

permissions:
  sharedchain.admin:
    description: Admin permission for SharedChain.
    default: op
    children:
      sharedchain.use: true
      sharedchain.debug: true
  sharedchain.use:
    description: Basic use permission for SharedChain.
    default: true
  sharedchain.debug:
    description: Debug permission for SharedChain.
    default: op
